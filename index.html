<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>E2B Bangla · dictionary</title>
  <!-- PWA manifest & icons (same as before, updated theme-color) -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#9B4B4E" /> <!-- softer primary -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./img/logo.png" />
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <!-- font & style reset -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Merriweather:wght@400;700&family=Noto+Sans+Bengali:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* ----- MODERN RESET / DESIGN SYSTEM (UX overhaul) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #9B4B4E;
      /* warm, accessible */
      --primary-soft: #b77b7d;
      --primary-bg: #fef6f7;
      /* light background for cards */
      --bg-light: #fafbfc;
      --surface: #ffffff;
      --text-main: #1e2b37;
      --text-muted: #5e6f7d;
      --border-light: #e2e8f0;
      --shadow-card: 0 20px 35px -8px rgba(0, 15, 30, 0.1), 0 4px 8px rgba(0, 0, 0, 0.02);
      --radius-md: 18px;
      --radius-lg: 28px;
      --transition: all 0.2s ease;
    }

    body.dark-mode {
      --primary: #c98a8d;
      --primary-soft: #a47274;
      --primary-bg: #2d2f36;
      --bg-light: #1e2128;
      --surface: #2b2f3a;
      --text-main: #edeef2;
      --text-muted: #aab3c5;
      --border-light: #3d4354;
      --shadow-card: 0 20px 30px -8px rgba(0, 0, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    body {
      font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
      background: var(--bg-light);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 1.5rem;
    }

    /* ----- LAYOUT + STICKY HEADER REFINED ----- */
    .app-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: #9B4B4E;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 0 0 32px 32px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 1.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
    }

    .header-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      width: 100%;
    }

    .header-left,
    .header-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .header-center {
      font-weight: 650;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      color: #ffffff;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    .icon-btn {
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .pill-install {
      background: rgba(255, 255, 255, 0.25);
      color: white;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .pill-install:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* ----- 3‑COLUMN GRID (adaptive) ----- */
    .dictionary-grid {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 260px;
      gap: 1.2rem;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 1.4rem 1rem;
      transition: transform 0.1s ease;
    }

    /* left & right columns — visible only on large */
    .left-col,
    .right-col {
      display: block;
    }

    /* ----- SEARCH & SUGGEST (center stage) ----- */
    .search-container {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .search-input {
      width: 100%;
      border: 2px solid transparent;
      background: var(--surface);
      border-radius: 48px;
      padding: 1rem 1rem 1rem 3rem;
      font-size: 1.1rem;
      color: var(--text-main);
      outline: none;
      /* box-shadow: var(--shadow-card); */
      transition: 0.15s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 12%, transparent);
      border-radius: 30px;
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-height: 380px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      backdrop-filter: blur(6px);
    }

    .suggestion-item {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: 0.1s;
    }

    .suggestion-item:hover {
      background: color-mix(in srgb, var(--primary) 10%, var(--surface));
    }

    .suggestion-word {
      font-weight: 600;
      color: var(--primary);
    }

    .suggestion-bn {
      color: var(--text-muted);
      font-family: 'Noto Sans Bengali';
    }

    .offline-chip {
      background: color-mix(in srgb, #f0b400 20%, var(--surface));
      border: 1px dashed #f0b400;
      border-radius: 60px;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      margin: 0.5rem 0;
      color: var(--text-main);
    }

    /* word card premium */
    .word-card {
      display: none;
      animation: cardRise 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes cardRise {
      from {
        opacity: 0.3;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .word-title {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      line-height: 1.2;
      font-weight: 700;
      color: var(--text-main);
    }

    .phonetic-badge {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
      margin-left: 0.5rem;
    }

    .audio-button {
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      border-radius: 100px;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--border-light);
      display: inline-flex;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-main);
      font-family: inherit;
    }

    .audio-button:hover {
      background: var(--primary);
      color: white;
    }

    .meaning-bangla {
      background: color-mix(in srgb, var(--primary) 6%, var(--surface));
      border-left: 5px solid var(--primary);
      border-radius: 18px;
      padding: 1.2rem;
      margin: 1rem 0;
      font-size: 1.4rem;
      font-weight: 600;
      font-family: 'Noto Sans Bengali';
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      margin: 0.8rem 0;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.9rem;
      transition: 0.1s;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    .example-text {
      padding: 0.7rem 0;
      border-bottom: 1px dashed var(--border-light);
      color: var(--text-muted);
      font-style: italic;
    }

    .skeleton-block {
      height: 24px;
      background: linear-gradient(100deg, var(--border-light) 20%, color-mix(in srgb, white 70%, var(--border-light)) 50%, var(--border-light) 80%);
      background-size: 200% 100%;
      animation: ske 1.2s infinite;
      border-radius: 30px;
      margin-bottom: 0.8rem;
    }

    @keyframes ske {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    /* left column specifics */
    .side-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .recent-item,
    .mini-link {
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      padding: 0.7rem;
      border-radius: 40px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
      transition: 0.15s;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
    }

    .recent-item:hover,
    .mini-link:hover {
      background: color-mix(in srgb, var(--primary) 8%, var(--surface));
      border-color: var(--border-light);
    }

    .recent-item span {
      font-weight: 500;
    }

    .recent-item small {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* right column "word of the day" big */
    .wod-card {
      background: var(--primary-bg);
      border-radius: 28px;
      padding: 1.2rem 1rem;
      margin-bottom: 1.4rem;
      border: 1px solid var(--border-light);
    }

    .wod-word {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.3rem;
    }

    .wod-meaning {
      font-family: 'Noto Sans Bengali';
      font-size: 1.2rem;
      color: var(--primary);
    }

    .suggest-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .suggest-tag {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.1s;
      font-family: inherit;
    }

    .suggest-tag:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .install-note {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1rem;
      padding: 1rem 0;
      border-top: 1px dashed var(--border-light);
    }

    .welcome-card {
      text-align: center;
      padding: 2.8rem 1rem;
    }

    .welcome-card h3 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .welcome-card p {
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto;
    }

    .bookmark-active {
      background: var(--primary) !important;
      color: white;
      border-color: var(--primary) !important;
    }

    .center-col {
      display: contents;
    }

    @media (max-width: 1000px) {
      .dictionary-grid {
        grid-template-columns: 1fr;
      }

      .left-col,
      .right-col {
        display: none;
      }

      .header-center {
        font-size: 1rem;
        max-width: 50vw;
      }
    }
  </style>
</head>

<body>
  <div class="app-wrap">
    <!-- STICKY HEADER (redesigned) -->
    <div class="sticky-header">
      <div class="header-grid">
        <div class="header-left">
          <button id="themeBtn" class="icon-btn" title="Light/dark">
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C388.8 576 451.3 548.8 497.3 504.6C504.6 497.6 506.7 486.7 502.6 477.5C498.5 468.3 488.9 462.6 478.8 463.4C473.9 463.8 469 464 464 464C362.4 464 280 381.6 280 280C280 207.9 321.5 145.4 382.1 115.2C391.2 110.7 396.4 100.9 395.2 90.8C394 80.7 386.6 72.5 376.7 70.3C358.4 66.2 339.4 64 320 64z" />
            </svg>
          </button>
        </div>
        <div id="focusTitle" class="header-center" >E2B Dictionary
        </div>
        <div class="header-right">
          <button id="copyBtn" class="icon-btn" title="Copy meaning"><svg viewBox="0 0 24 24">
              <path
                d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1Zm4 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z" />
            </svg></button>
          <button id="bookmarkBtn" class="icon-btn" title="Bookmark word"><svg viewBox="0 0 24 24">
              <path d="M5 2h14c1.1 0 2 .9 2 2v20l-9-4-9 4V4c0-1.1.9-2 2-2z" />
            </svg></button>
          <button id="installBtn" class="icon-btn pill-install" style="display:none;" title="Install app"><svg
              viewBox="0 0 24 24">
              <path
                d="M19 15v4H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4h-2Zm-8-1.17 2.59-2.58L15 12.66l-3 3-3-3 1.41-1.41L11 13.83ZM11 3h2v9h-2V3Z" />
            </svg></button>
        </div>
      </div>
      <main class="center-col">
        <div class="search-container">
          <span class="search-icon"><i class="fa fa-search" aria-hidden="true"></i></span>
          <input id="searchInput" class="search-input" type="text" placeholder="Search any English word..."
            autocomplete="off" />
          <div id="suggestions" class="suggestions"></div>
        </div>
        <div id="offlineBanner" class="offline-chip">📡 offline — using cached dictionary</div>
      </main>
    </div>
    <!-- 3‑COLUMN GRID -->
    <div class="dictionary-grid">
      <!-- LEFT COL: recent & quick -->
      <aside class="left-col panel">
        <div class="side-label"><i class="fa fa-clock-o"></i> recent searches</div>
        <ul id="recentList" style="list-style: none; margin-bottom: 2rem;">
          <p style="color: #5e6f7d; font-family: monospace;">Nothing to show :(</p>
        </ul>
      </aside>

      <!-- CENTER COLUMN: main action -->
      <div style="display:contents;">
        <!-- welcome / word card -->
        <div id="welcomeView" class="panel welcome-card">
          <h3><i class="fa fa-book" aria-hidden="true"></i> E2B Dictionary</h3>
          <p>Bangla meanings, phonetics, synonyms, examples. Search above.</p>
          <div style="margin-top:1.2rem; color: var(--primary);"><i class="fa fa-arrow-up" aria-hidden="true"></i> start
            typing</div>
        </div>

        <div id="wordCard" class="word-card panel"></div>
      </div>

      <!-- RIGHT COLUMN: word of day, suggested, PWA hint -->
      <aside class="right-col panel">
        <div class="wod-card">
          <div style="font-size:0.85rem; color:var(--text-muted);">✨ word of the day</div>
          <div id="wodWord" class="wod-word">—</div>
          <div id="wodMeaning" class="wod-meaning"></div>
          <button id="wordOfDayBtn" style="margin-top:0.8rem; width:100%;" class="mini-link">see details <i
              class="fa fa-arrow-right" aria-hidden="true"></i></button>
        </div>

        <div class="side-label"><i class="fa fa-search" aria-hidden="true"></i> suggested words</div>
        <div id="suggestedWords" class="suggest-tags" style="color:var(--text-muted);"></div>

        <div class="install-note">
          <strong><i class="fa fa-download" aria-hidden="true"></i> PWA ready</strong><br>
          <span style="font-size:0.8rem;">Install for offline use & quick access.</span>
        </div>
        <div
          style="margin-top:1rem; font-size:0.8rem; background: var(--primary-bg); border-radius:30px; padding:0.6rem;">
          "<b>/</b>" to search</div>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      // ---------- CONFIG ----------
      const DICT_URL = 'https://raw.githubusercontent.com/towfikahmed0/e2b_dictionary/main/dictionary.json';
      const API_BASE = 'https://api.dictionaryapi.dev/api/v2/entries/en/';

      // DOM elements
      const el = {
        searchInput: document.getElementById('searchInput'),
        suggestions: document.getElementById('suggestions'),
        wordCard: document.getElementById('wordCard'),
        welcomeView: document.getElementById('welcomeView'),
        focusTitle: document.getElementById('focusTitle'),
        copyBtn: document.getElementById('copyBtn'),
        bookmarkBtn: document.getElementById('bookmarkBtn'),
        installBtn: document.getElementById('installBtn'),
        themeBtn: document.getElementById('themeBtn'),
        offlineBanner: document.getElementById('offlineBanner'),
        recentList: document.getElementById('recentList'),
        wordOfDayBtn: document.getElementById('wordOfDayBtn'),
        suggestedWords: document.getElementById('suggestedWords'),
        wodWord: document.getElementById('wodWord'),
        wodMeaning: document.getElementById('wodMeaning'),
      };

      // data
      let dictionary = [];               // raw { en, bn, syn, ant, ... }
      let currentWord = null;
      let deferredPrompt;

      // storage helpers
      const getStorage = (key, def = []) => { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } };
      const setStorage = (key, val) => localStorage.setItem(key, JSON.stringify(val));

      const RECENT_KEY = 'e2b_recent';
      const BOOKMARK_KEY = 'e2b_bookmarks';
      const THEME_KEY = 'theme';

      // --- recent UI ---
      const renderRecent = () => {
        const recents = getStorage(RECENT_KEY, []);
        if (recents.length) {
          el.recentList.innerHTML = recents.map(w => `<li><button class="recent-item" data-recent="${w}"><span><span><i class="fa fa-angle-right" aria-hidden="true"></i> ${w}</span> <small>recent</small></button></li>`).join('');
        } else {
          el.recentList.innerHTML = '<li style="color:var(--text-muted); padding:0.5rem;">No searches yet</li>';
        }
      };

      const addRecent = (word) => {
        let recents = getStorage(RECENT_KEY, []);
        recents = [word, ...recents.filter(w => w !== word)].slice(0, 10);
        setStorage(RECENT_KEY, recents);
        renderRecent();
      };

      // --- bookmarks ---
      const updateBookmarkUI = () => {
        if (!currentWord) { el.bookmarkBtn.classList.remove('bookmark-active'); return; }
        const bookmarks = getStorage(BOOKMARK_KEY, []);
        if (bookmarks.includes(currentWord.en)) el.bookmarkBtn.classList.add('bookmark-active');
        else el.bookmarkBtn.classList.remove('bookmark-active');
      };

      const toggleBookmark = () => {
        if (!currentWord) return;
        const bookmarks = getStorage(BOOKMARK_KEY, []);
        const idx = bookmarks.indexOf(currentWord.en);
        if (idx === -1) bookmarks.push(currentWord.en);
        else bookmarks.splice(idx, 1);
        setStorage(BOOKMARK_KEY, bookmarks);
        updateBookmarkUI();
        el.bookmarkBtn.style.transform = 'scale(1.2)';
        setTimeout(() => el.bookmarkBtn.style.transform = '', 150);
      };

      // --- copy ---
      const copyDetails = async () => {
        if (!currentWord) return;
        const bnText = currentWord.bn ? currentWord.bn.join(', ') : '';
        const text = `${currentWord.en} — ${bnText}`;
        try {
          await navigator.clipboard.writeText(text);
          el.copyBtn.style.background = 'rgba(255,255,255,0.4)';
          setTimeout(() => el.copyBtn.style.background = '', 200);
        } catch { }
      };

      // --- theme ---
      const setTheme = (dark) => document.body.classList.toggle('dark-mode', dark);
      const toggleTheme = () => {
        const dark = !document.body.classList.contains('dark-mode');
        setTheme(dark);
        localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
      };

      // --- render word card (rich) ---
      const renderWordCard = (data) => {
        const bnMeaning = data.bn?.length ? data.bn.join(', ') : '—';
        const phonetic = data.phonetic || (data.phonetics?.find(p => p.text)?.text) || '';
        const audioUrl = data.phonetics?.find(p => p.audio)?.audio || null;
        const pos = data.meanings ? [...new Set(data.meanings.map(m => m.partOfSpeech))] : [];
        const synonyms = data.syn ? data.syn.slice(0, 10) : [];
        const antonyms = data.ant ? data.ant.slice(0, 10) : [];
        const definitions = data.meanings ? data.meanings.flatMap(m => m.definitions.map(d => d.definition)).slice(0, 4) : [];
        const examples = data.meanings ? data.meanings.flatMap(m => m.definitions.map(d => d.example).filter(Boolean)).slice(0, 3) : [];

        let html = `<div style="display:flex; justify-content:space-between; align-items:start;"><h1 class="word-title">${data.en}</h1>`;
        if (audioUrl) html += `<button id="audioPlayBtn" class="audio-button"><i class="fa fa-volume-up" aria-hidden="true"></i> listen</button>`;
        html += `</div>`;
        if (phonetic) html += `<div class="phonetic-badge">${phonetic}</div>`;

        html += `<div class="meaning-bangla">${bnMeaning}</div>`;

        if (pos.length) html += `<div class="chip-list">${pos.map(p => `<span class="chip">${p}</span>`).join('')}</div>`;

        if (synonyms.length) html += `<div style="margin:1rem 0"><span style="font-weight:600;">synonyms</span> <div class="chip-list">${synonyms.map(s => `<span class="chip">${s}</span>`).join('')}</div></div>`;
        if (antonyms.length) html += `<div style="margin:1rem 0"><span style="font-weight:600;">antonyms</span> <div class="chip-list">${antonyms.map(a => `<span class="chip">${a}</span>`).join('')}</div></div>`;

        if (definitions.length) {
          html += `<div style="margin-top:1rem;"><span style="font-weight:600;">definitions</span>`;
          definitions.slice(0, 3).forEach(d => html += `<div style="padding:0.5rem 0;">• ${d}</div>`);
          html += `</div>`;
        }

        if (examples.length) {
          html += `<div style="margin-top:1rem;"><span style="font-weight:600;">examples</span>`;
          examples.forEach(ex => html += `<div class="example-text">"${ex}"</div>`);
          html += `</div>`;
        }

        el.wordCard.innerHTML = html;

        if (audioUrl) {
          document.getElementById('audioPlayBtn')?.addEventListener('click', () => {
            new Audio(audioUrl).play().catch(() => { });
          });
        }
      };

      const showSkeleton = () => {
        el.wordCard.style.display = 'block';
        el.wordCard.innerHTML = `<div class="skeleton-block" style="width:60%"></div><div class="skeleton-block" style="width:40%"></div><div class="skeleton-block" style="height:60px"></div><div class="skeleton-block"></div><div class="skeleton-block" style="width:80%"></div>`;
      };

      // --- display word (main) ---
      const displayWord = async (wordObj) => {
        currentWord = wordObj;
        addRecent(wordObj.en);
        el.focusTitle.innerText = wordObj.en;
        el.searchInput.value = wordObj.en;
        el.suggestions.style.display = 'none';
        el.welcomeView.style.display = 'none';
        showSkeleton();
        updateBookmarkUI();

        let merged = { ...wordObj };
        try {
          const res = await fetch(API_BASE + encodeURIComponent(wordObj.en));
          if (res.ok) {
            const apiData = await res.json();
            merged = { ...wordObj, ...apiData[0] };
          }
        } catch (e) { /* silent */ }

        renderWordCard(merged);
        currentWord = merged;
        updateBookmarkUI();
      };

      const clearWelcome = () => {
        currentWord = null;
        el.wordCard.style.display = 'none';
        el.welcomeView.style.display = 'block';
        el.focusTitle.innerText = 'E2B Dictionary';
        updateBookmarkUI();
      };

      // --- suggestion search ---
      const doSearch = (query) => {
        const q = query.toLowerCase().trim();
        if (!q) { el.suggestions.style.display = 'none'; return; }
        const matches = dictionary.filter(w => w.en.toLowerCase().startsWith(q)).slice(0, 10);
        el.suggestions.innerHTML = matches.length ? matches.map(w => `<div class="suggestion-item" data-word="${w.en}"><span class="suggestion-word">${w.en}</span><span class="suggestion-bn">${w.bn?.[0] || ''}</span></div>`).join('') : '<div class="suggestion-item">not found</div>';
        el.suggestions.style.display = 'block';
      };

      // --- load dictionary & enrich UI ---
      const loadDictionary = async () => {
        try {
          const resp = await fetch(DICT_URL);
          dictionary = await resp.json();
          renderRecent();

          // word of day (random)
          if (dictionary.length) {
            const random = dictionary[Math.floor(Math.random() * dictionary.length)];
            el.wodWord.innerText = random.en;
            el.wodMeaning.innerText = random.bn?.[0] || '';
            el.wordOfDayBtn.onclick = () => displayWord(random);
          }

          // suggested words (random 8)
          const shuffled = [...dictionary].sort(() => 0.5 - Math.random()).slice(0, 8);
          el.suggestedWords.innerHTML = shuffled.map(w => `<button style="color:var(--text-muted);" class="suggest-tag" data-suggest="${w.en}">${w.en}</button>`).join('');
          document.querySelectorAll('[data-suggest]').forEach(btn => {
            btn.addEventListener('click', () => {
              const found = dictionary.find(d => d.en === btn.dataset.suggest);
              if (found) displayWord(found);
            });
          });
        } catch (err) {
          el.welcomeView.innerHTML = '<h3><i class="fa fa-exclamation-triangle" aria-hidden="true"></i> offline dictionary missing</h3><p>Pull from github failed — use cached if any</p>';
        }
      };

      // --- event listeners ---
      el.searchInput.addEventListener('input', (e) => doSearch(e.target.value));
      el.suggestions.addEventListener('click', (e) => {
        const item = e.target.closest('[data-word]');
        if (!item) return;
        const found = dictionary.find(w => w.en === item.dataset.word);
        if (found) displayWord(found);
      });

      el.copyBtn.addEventListener('click', copyDetails);
      el.bookmarkBtn.addEventListener('click', toggleBookmark);
      el.themeBtn.addEventListener('click', toggleTheme);

      el.recentList.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-recent]');
        if (!btn) return;
        const found = dictionary.find(w => w.en === btn.dataset.recent);
        if (found) displayWord(found);
      });

      document.querySelectorAll('[data-quick]').forEach(btn => {
        btn.addEventListener('click', () => {
          const word = btn.dataset.quick;
          const found = dictionary.find(w => w.en.toLowerCase() === word);
          if (found) displayWord(found);
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) el.suggestions.style.display = 'none';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === '/') { e.preventDefault(); el.searchInput.focus(); }
        if (e.key === 'Escape') el.suggestions.style.display = 'none';
      });

      window.addEventListener('online', () => { el.offlineBanner.style.display = 'none'; });
      window.addEventListener('offline', () => { el.offlineBanner.style.display = 'flex'; });
      setTheme(localStorage.getItem(THEME_KEY) === 'dark');

      // PWA install
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        el.installBtn.style.display = 'inline-flex';
      });
      el.installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const res = await deferredPrompt.userChoice;
        if (res.outcome === 'accepted') el.installBtn.style.display = 'none';
        deferredPrompt = null;
      });

      // initial load
      if (navigator.onLine) el.offlineBanner.style.display = 'none';
      else el.offlineBanner.style.display = 'flex';

      loadDictionary();

      // register service worker (keep PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
      }
    })();
  </script>
</body>

</html>
